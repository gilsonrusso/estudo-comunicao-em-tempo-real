apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: collaborative-latex-editor
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/gilsonrusso/estudo-comunicao-em-tempo-real.git'
    targetRevision: HEAD
    path: k8s/base
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: collab-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
