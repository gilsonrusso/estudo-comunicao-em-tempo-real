apiVersion: apps/v1
kind: Deployment
metadata:
  name: collab-compiler
  namespace: collab-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: compiler
  template:
    metadata:
      labels:
        app: compiler
    spec:
      containers:
        - name: compiler
          image: 04-collaborative-editor-compiler:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4000
          env:
            - name: PORT
              value: "4000"
            - name: HOST
              value: "0.0.0.0"
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: compiler
  namespace: collab-app
spec:
  ports:
    - port: 4000
      targetPort: 4000
  selector:
    app: compiler
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: compiler-hpa
  namespace: collab-app
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: collab-compiler
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
