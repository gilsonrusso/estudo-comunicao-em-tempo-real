apiVersion: apps/v1
kind: Deployment
metadata:
  name: collab-frontend
  namespace: collab-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: 04-collaborative-editor-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5173
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: collab-app
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 5173
  selector:
    app: frontend
