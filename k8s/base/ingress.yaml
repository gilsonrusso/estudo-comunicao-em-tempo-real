apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: collab-ingress
  namespace: collab-app
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: "backend"
spec:
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 3333
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 3333
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
