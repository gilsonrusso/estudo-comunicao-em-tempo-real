services:
  postgres:
    image: postgres:16-alpine
    container_name: collab-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=collab_db
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d collab_db"]
      interval: 3s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: collab-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  compiler:
    build: ./compiler
    container_name: collab-compiler
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - HOST=0.0.0.0
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  backend:
    build: ./backend
    container_name: collab-backend
    ports:
      - "3333:3333"
    environment:
      - PORT=3333
      - HOST=0.0.0.0
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/collab_db
      - REDIS_URL=redis://redis:6379
      - COMPILER_URL=http://compiler:4000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      compiler:
        condition: service_started
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: collab-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
