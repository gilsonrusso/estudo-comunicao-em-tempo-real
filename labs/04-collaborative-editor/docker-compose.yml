services:
  postgres:
    image: postgres:16-alpine
    container_name: collab-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=collab_db
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d collab_db"]
      interval: 3s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: collab-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  compiler:
    build: ./compiler
    container_name: collab-compiler
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - HOST=0.0.0.0
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  minio:
    image: cleanstart/minio:latest
    container_name: collab-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin123
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data
    restart: unless-stopped

  languagetool:
    image: erikvl87/languagetool:6.8
    container_name: collab-languagetool
    ports:
      - "8081:8010"
      - "8010:8010"
    environment:
      - Java_Xms=256m
      - Java_Xmx=1g
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: collab-backend
    ports:
      - "3333:3333"
    environment:
      - PORT=3333
      - HOST=0.0.0.0
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/collab_db
      - REDIS_URL=redis://redis:6379
      - COMPILER_URL=http://compiler:4000
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin123
      - MINIO_BUCKET=collab-assets
      - LANGUAGETOOL_URL=http://languagetool:8010/v2/check
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      compiler:
        condition: service_started
      minio:
        condition: service_started
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: collab-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  miniodata:
